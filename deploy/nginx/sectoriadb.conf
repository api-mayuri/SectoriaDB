# TLS-терминация для SectoriaDB (nginx 1.30). Монтируется в /etc/nginx/conf.d/default.conf (см. docker-compose.yml);
# описание и проверенные клиенты: docs/guide/operations.md (раздел «TLS через nginx»).
#
# Правила, без которых S3 ломается:
#  - Host уходит как пришёл ($http_host, с портом): SigV4 подписывает host.
#  - proxy_pass без URI-части: путь (с %2F, %20, юникодом, "//") уходит серверу байт в байт, как у клиента.
#  - тело и ответ не буферизуются, лимит тела 5 ГиБ, длинные таймауты, HTTP/1.1 с keep-alive к серверу.
#  - в журнал доступа попадает $uri, но не $request и не $args: в строке запроса presigned-ссылки лежат X-Amz-Signature
#    и X-Amz-Credential, а по журналу их можно было бы повторить до истечения срока ссылки (до 7 суток).
#  - заголовки Forwarded / X-Forwarded-Host / X-Forwarded-Port / X-Real-IP, пришедшие от клиента, сбрасываются.
# Порт управления (9464: метрики, health) сюда намеренно не проксируется.
# Защита от медленных и многочисленных клиентов: limit_conn на адрес, limit_req на запросы без подписи, короткие
# таймауты клиента (docs/architecture/security.md, «Лимиты и защита от злоупотреблений»).

server_tokens off;

# Заголовки с "_" nginx по умолчанию отбрасывает; S3-клиентам они не нужны (underscores_in_headers не включаем).

log_format s3safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
# access_log is set inside each server{}: a directive at this level would ADD a log next to the stock image's
# http-level "main" log, which prints $request with the query string. (error_log lines of failed requests do print the
# request line with its query; do not ship error_log to places where presigned URLs must stay secret.)

# Число одновременных запросов с одного адреса (HTTP/2: каждый поток считается). Меньше пула потоков сервера (200).
limit_conn_zone $binary_remote_addr zone=sectoria_conn:10m;
limit_conn_status 503;
limit_conn_log_level warn;

# Запрос без подписи (нет Authorization: AWS4-HMAC-SHA256 и нет X-Amz-Signature в строке запроса) — анонимный
# или мусорный. Его скорость ограничена по адресу; подписанные запросы лимитом по скорости не затрагиваются
# (у них свои лимиты на ключ в самом сервере).
map $http_authorization $sectoria_has_auth {
    ~*^AWS4-HMAC-SHA256 1;
    default             0;
}
map $args $sectoria_has_presig {
    ~*(^|&)x-amz-signature= 1;
    default                 0;
}
map "$sectoria_has_auth$sectoria_has_presig" $sectoria_anon_key {
    "00"    $binary_remote_addr;
    default "";                      # пустой ключ limit_req не считает
}
limit_req_zone $sectoria_anon_key zone=sectoria_anon:10m rate=20r/s;
limit_req_status 503;
limit_req_log_level warn;

upstream sectoriadb {
    server sectoriadb:8080;          # имя сервиса compose; без compose — адрес сервера
    keepalive 32;
}

# HTTP -> HTTPS. Для нестандартного внешнего порта HTTPS замените на https://$host:ПОРТ$request_uri.
server {
    listen 80;
    server_name _;
    access_log /dev/stdout s3safe;
    # certbot (webroot): добавьте сюда  location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /dev/stdout s3safe;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # PutObject / UploadPart: до 5 ГиБ на запрос
    client_max_body_size 5g;
    # таймауты между двумя операциями чтения/записи, не на весь запрос: медленный клиент отсекается, быстрая выгрузка нет
    client_header_timeout 15s;
    client_body_timeout   60s;
    large_client_header_buffers 4 16k;

    limit_conn sectoria_conn 200;
    limit_req  zone=sectoria_anon burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://sectoriadb;            # без URI-части: путь не переписывается

        proxy_http_version 1.1;
        proxy_set_header Connection "";          # keep-alive к серверу
        proxy_set_header Host $http_host;        # подпись SigV4 покрывает host (вместе с портом)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;   # nginx — крайний прокси: пришедшее от клиента не доверяем
        proxy_set_header X-Forwarded-Host  "";             # пустое значение: заголовок на сервер не уходит
        proxy_set_header X-Forwarded-Port  "";
        proxy_set_header Forwarded         "";
        proxy_set_header X-Real-IP         "";

        proxy_request_buffering off;             # тело сразу к серверу, а не на диск прокси
        proxy_buffering         off;             # потоковая отдача больших GET

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;              # пауза между записями к серверу
        proxy_read_timeout    3600s;             # CompleteMultipartUpload и большой листинг молчат долго
        send_timeout          120s;              # клиент не принимает ответ дольше этого — соединение закрывается
    }
}

spring.application.name=SectoriaDB
spring.main.web-application-type=servlet
# S3 PUT/DELETE bodies are raw data (policies, objects) — never parse them as HTML forms
spring.mvc.formcontent.filter.enabled=false

# Long downloads / paused video players: Tomcat blocks on a full socket buffer and gives up after this timeout.
# Keep it generous so playback is never cut in the middle; idle keep-alive connections are closed sooner.
server.tomcat.connection-timeout=10m
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-keep-alive-requests=1000
spring.shell.interactive.enabled=true
server.port=8080

# ── SectoriaDB storage defaults ────────────────────────────────────────────────
sectoriadb.meta-dir=./sectoriadb-meta
sectoriadb.data-dir=./sectoriadb-data
sectoriadb.default-chunk-size=16384
sectoriadb.default-num-buckets=65536
sectoriadb.max-evictions=32
# fsync data and metadata writes (crash safety); disable only for benchmarks
sectoriadb.fsync=true

# ── Small objects (smaller than default-chunk-size): whole object in an append-only small_*.sob file ─────
# A small-object blob that reaches this size takes no more appends; the pool gets a new one.
sectoriadb.small-object.max-file-bytes=1073741824
# The recovery hint in the blob header advances after this many appended bytes (and on close).
sectoriadb.small-object.checkpoint-interval-bytes=16777216

# ── Auto-resize ────────────────────────────────────────────────────────────────
sectoriadb.auto-resize.enabled=true
sectoriadb.auto-resize.threshold-percent=80
sectoriadb.auto-resize.expand-percent=50
sectoriadb.auto-resize.check-interval-ms=60000

# ── Jackson: use ISO-8601 for Instant fields ───────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── S3 API ────────────────────────────────────────────────────────────────────
sectoriadb.s3.region=us-east-1
# Set to false to disable SigV4 auth (development mode)
sectoriadb.s3.auth.enabled=true
# Auth enabled but no access keys exist yet: deny everything (default) or, as an explicit opt-in, let all
# requests through while you are setting the server up. Create a key with the shell command 'mk-key'.
sectoriadb.s3.auth.allow-open-setup=false
# Accept "x-amz-content-sha256: UNSIGNED-PAYLOAD" (and STREAMING-UNSIGNED-PAYLOAD-TRAILER) on signed requests.
# Set to false to require a signed payload hash / signed chunks (the body is then always integrity-checked).
sectoriadb.s3.auth.allow-unsigned-payload=true

# Multiple S3 credentials (comma-separated, format: ACCESS:SECRET or ACCESS:SECRET:description)
# Example: sectoriadb.s3.credentials=AKIAIOSFODNN7EXAMPLE:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY,AKIAIOSFODNN7ANOTHER:yWalrXUtnFEMI/K7MDENG/cPxRfiCYEXAMPLEKEY:prod-key
# sectoriadb.s3.credentials=

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.example.sectoriadb=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG
spring.application.name=SectoriaDB
spring.main.web-application-type=servlet
# S3 PUT/DELETE bodies are raw data (policies, objects) — never parse them as HTML forms
spring.mvc.formcontent.filter.enabled=false

# Slow-client protection (docs/architecture/02-security.md). connection-timeout is the socket read/write
# timeout: a client that sends nothing for this long is cut (a paused video player reconnects with a Range request).
# On top of it the body of every request must keep a minimum rate (sectoriadb.s3.limits.*) and one access key may only
# occupy a bounded number of worker threads.
server.tomcat.connection-timeout=60s
server.tomcat.keep-alive-timeout=30s
server.tomcat.max-keep-alive-requests=1000
server.tomcat.threads.max=200
server.tomcat.max-connections=2048
server.tomcat.accept-count=200
server.tomcat.max-swallow-size=1MB
# Finish running requests on shutdown (docker stop) instead of cutting uploads
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# GC pass, 6 h sweep, compaction, pool growth and multipart cleanup must not wait for each other
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=sectoria-sched-
spring.shell.interactive.enabled=true
server.port=8080
# Spring errors raised before a controller is chosen (405, 415, ...) are rendered as S3 XML by S3ErrorController at this
# internal path; not /error, which is a valid bucket name
server.error.path=/.s3-error

# ── SectoriaDB storage defaults ────────────────────────────────────────────────
sectoriadb.meta-dir=./sectoriadb-meta
sectoriadb.data-dir=./sectoriadb-data
# Upload bodies are spooled here before they are written to blobs (default: <data-dir>/.tmp; leftovers of a crash are
# removed at start). Size it for the largest concurrent uploads (up to 5 GiB each).
#sectoriadb.upload-tmp-dir=
sectoriadb.default-chunk-size=16384
sectoriadb.default-num-buckets=65536
sectoriadb.max-evictions=32
# fsync data and metadata writes (crash safety); disable only for benchmarks
sectoriadb.fsync=true
# Metastore group commit: concurrent small writes share one commit (docs/architecture/09-multi-blob-pool.md).
# A batch is whatever queued up while the previous commit was running; max-wait-micros > 0 adds an artificial delay.
sectoriadb.metastore.group.max-batch-size=256
sectoriadb.metastore.group.max-batch-pages=1024
sectoriadb.metastore.group.max-wait-micros=0
sectoriadb.metastore.group.queue-capacity=4096
# After a failed commit (full / failing disk) the store serves reads from the last committed snapshot and refuses writes
# (503 SlowDown, 507 for a full disk); it recovers in place on the next write once the disk works. This is the pause
# between recovery attempts while it still fails (writes fail fast inside it).
sectoriadb.metastore.recovery-backoff=1s

# ── Memory residency (docs/architecture/10-gc-and-resize.md) ───────────────────────────────────────────
# The slot table of a cuckoo blob (~9 MiB at the default geometry) is loaded on first use and kept while it is among the
# most recently used; the others are evicted when nothing uses them (a table in use is never closed). Soft limits.
sectoriadb.cache.max-resident-tables=64
# Optional memory budget for resident tables in bytes (0 = only the count above)
sectoriadb.cache.max-resident-table-bytes=0
# Open small-object files (one per bucket at least)
sectoriadb.cache.max-open-small-blobs=256

# ── Small objects (smaller than default-chunk-size): whole object in an append-only small_*.sob file ─────
# A small-object blob that reaches this size takes no more appends; the pool gets a new one.
sectoriadb.small-object.max-file-bytes=1073741824
# The recovery hint in the blob header advances after this many appended bytes (and on close).
sectoriadb.small-object.checkpoint-interval-bytes=16777216

# ── Pools: several cuckoo blobs per bucket (docs/architecture/09-multi-blob-pool.md) ─────────────────────────
# Chunks are spread over the blobs of a pool by weighted rendezvous hashing. A blob is added when the aggregate fill
# of the pool reaches the threshold or when no blob accepts a chunk; a pool never exceeds max-blobs.
sectoriadb.pool.initial-blobs=1
sectoriadb.pool.max-blobs=16
sectoriadb.pool.grow-threshold-percent=75
# LRU of chunk -> blob hints that spares most index lookups on reads (a hint is verified by the CRC of the chunk; 0 = off)
sectoriadb.pool.location-cache-entries=65536

# ── Garbage collection (docs/architecture/10-gc-and-resize.md) ───────────────────────────────────────────────
# Frees the space of deleted / overwritten objects: slots of unreferenced chunks, stray copies of crashed or aborted
# uploads, tombstones, dead bytes of small-object files. false = only the shell commands 'gc run|sweep|compact' work.
sectoriadb.gc.enabled=true
# Grace period G: garbage younger than this is never collected (covers uploads that deduplicated against a chunk and have not
# committed yet, and readers that hold an old version). An upload slower than G gets a retryable 503 instead of corrupt data.
sectoriadb.gc.grace=15m
# Pause between passes over the chunk queue / orphans / tombstones, and the most chunk slots one pass frees
sectoriadb.gc.interval=1m
sectoriadb.gc.max-chunks-per-run=10000
# Chunks freed per exclusive metastore transaction (1 = strictly one transaction per chunk)
sectoriadb.gc.batch-size=16
# Sweep of every blob for stray copies (no index entry): needs the upload gate, see sweep-gate-wait
sectoriadb.gc.sweep-interval=6h
sectoriadb.gc.sweep-gate-wait=2s
# An upload that holds the gate longer than this can be revoked by a sweep (its late commit then fails with 503)
sectoriadb.gc.upload-ticket-ttl=30m
# Compaction of small_*.sob files: when this percent of the record bytes (and at least min-dead-bytes) is dead
sectoriadb.gc.compact-interval=10m
sectoriadb.gc.small-compact-dead-percent=50
sectoriadb.gc.small-compact-min-dead-bytes=1048576

# ── Background pool growth check (the periodic backstop of the threshold above) ────────────────────────────────
sectoriadb.auto-resize.enabled=true
sectoriadb.auto-resize.check-interval-ms=60000

# ── S3 API ────────────────────────────────────────────────────────────────────
sectoriadb.s3.region=us-east-1
# Reject requests whose credential scope names another region than sectoriadb.s3.region (set false to accept any)
sectoriadb.s3.auth.enforce-region=true
# SigV4 requires host and every x-amz-* request header to be in SignedHeaders (what AWS does); false = lenient
sectoriadb.s3.auth.require-signed-headers=true
# Slow/greedy clients: a request body must average this many bytes/s after the grace period (else 400 RequestTimeout),
# and one access key may run this many concurrent writes (PUT/POST) / reads (GET/HEAD/DELETE) (else 503 SlowDown). 0 = off.
sectoriadb.s3.limits.min-body-bytes-per-second=1024
sectoriadb.s3.limits.min-body-rate-grace=30s
sectoriadb.s3.limits.max-inflight-writes-per-key=64
sectoriadb.s3.limits.max-inflight-reads-per-key=128
# An upload is refused with 503 when declared size + this reserve does not fit on the upload spool volume
sectoriadb.s3.limits.upload-free-space-reserve-bytes=67108864
# Multipart: an upload without activity for stale-after is removed; the record of a completed upload is kept for
# completed-retention so a client retry of CompleteMultipartUpload gets the same answer
sectoriadb.multipart.stale-after=7d
sectoriadb.multipart.completed-retention=24h
# every part except the last of a CompleteMultipartUpload must have at least this size, else 400 EntityTooSmall
# (Spring DataSize: MB is 1024*1024 bytes, so 5MB is the 5 MiB of AWS); 0 disables the check
sectoriadb.multipart.min-part-size=5MB
sectoriadb.multipart.cleanup-interval-ms=3600000
# Set to false to disable SigV4 auth (development mode)
sectoriadb.s3.auth.enabled=true
# Auth enabled but no access keys exist yet: deny everything (default) or, as an explicit opt-in, let all
# requests through while you are setting the server up. Create a key with the shell command 'mk-key'.
sectoriadb.s3.auth.allow-open-setup=false
# Accept "x-amz-content-sha256: UNSIGNED-PAYLOAD" (and STREAMING-UNSIGNED-PAYLOAD-TRAILER) on signed requests.
# Set to false to require a signed payload hash / signed chunks (the body is then always integrity-checked).
sectoriadb.s3.auth.allow-unsigned-payload=true

# Multiple S3 credentials (comma-separated, format: ACCESS:SECRET or ACCESS:SECRET:description)
# Example: sectoriadb.s3.credentials=AKIAIOSFODNN7EXAMPLE:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY,AKIAIOSFODNN7ANOTHER:yWalrXUtnFEMI/K7MDENG/cPxRfiCYEXAMPLEKEY:prod-key
# sectoriadb.s3.credentials=

# ── Observability (docs/architecture/08-observability-bench.md) ───────────────────────────────────────────
# /actuator/health and /actuator/prometheus are served ONLY on this separate port (own Tomcat, no SigV4, never
# reachable through the S3 port). Bind it to an internal interface in production: it is unauthenticated.
management.server.port=9464
#management.server.address=127.0.0.1
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Common tags, via configuration only (Prometheus adds its own 'instance' label from the scrape target).
management.metrics.tags.application=${spring.application.name}
#management.metrics.tags.instance=sectoria-1
# Tomcat thread pool gauges (tomcat_threads_busy_threads, tomcat_threads_config_max_threads, ...)
server.tomcat.mbeanregistry.enabled=true
# Our own S3 RED metrics replace Spring's http.server.requests (whose 'uri' tag would be the controller pattern)
management.metrics.enable.http.server.requests=false
# GC pauses as a histogram with explicit buckets (see Buckets.GC_PAUSE_PROPERTY_VALUE)
management.metrics.distribution.slo.jvm.gc.pause=1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
# Requests slower than this are logged at WARN with request id, operation, status, duration, bytes (0 = off)
sectoriadb.observability.slow-request-ms=2000
# State gauges (fill, metastore stats, disk space, object totals) are recomputed at most this often
sectoriadb.observability.gauge-cache-ms=15000

# ── Logging ────────────────────────────────────────────────────────────────────
# INFO by default: no bucket or key names are logged. Per-request DEBUG lines (with bucket/key) and Spring web DEBUG:
# start with --spring.profiles.active=debug (application-debug.properties).
logging.level.root=INFO
logging.level.org.example.sectoriadb=INFO

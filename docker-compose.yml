services:
  sectoriadb:
    build: .
    image: sectoriadb:latest
    container_name: sectoriadb
    stdin_open: true
    tty: true
    # The S3 port is NOT published: clients reach the server through the nginx service (TLS). For local development
    # without TLS add docker-compose.dev.yml.
    expose:
      - "${SERVER_PORT:-8080}"
    ports:
      # Prometheus metrics / health (management port, no SigV4): published on the host's loopback only
      - "127.0.0.1:${METRICS_HOST_PORT:-9464}:${MANAGEMENT_SERVER_PORT:-9464}"
    environment:
      SECTORIADB_META_DIR: /data/meta
      SECTORIADB_DATA_DIR: /data/storage
      SECTORIADB_S3_AUTH_ENABLED: ${SECTORIADB_S3_AUTH_ENABLED:-true}
      SECTORIADB_S3_AUTH_ALLOW_OPEN_SETUP: ${SECTORIADB_S3_AUTH_ALLOW_OPEN_SETUP:-false}
      SECTORIADB_S3_AUTH_ALLOW_UNSIGNED_PAYLOAD: ${SECTORIADB_S3_AUTH_ALLOW_UNSIGNED_PAYLOAD:-true}
      SECTORIADB_S3_REGION: ${SECTORIADB_S3_REGION:-us-east-1}
      # Everything arrives over HTTPS via nginx (X-Forwarded-Proto); plain HTTP is refused with 403 InsecureTransport
      SECTORIADB_S3_REQUIRE_SECURE_TRANSPORT: ${SECTORIADB_S3_REQUIRE_SECURE_TRANSPORT:-true}
      # trust X-Forwarded-* only from the nginx container (fixed address below), not from any private address
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: ${PROXY_ADDRESS_REGEX:-172\.31\.250\.10}
      SECTORIADB_S3_ACCESS_KEY: ${SECTORIADB_S3_ACCESS_KEY:-}
      SECTORIADB_S3_SECRET_KEY: ${SECTORIADB_S3_SECRET_KEY:-}
      SECTORIADB_S3_CREDENTIALS: ${SECTORIADB_S3_CREDENTIALS:-}
      SECTORIADB_CACHE_MAX_RESIDENT_TABLES: ${SECTORIADB_CACHE_MAX_RESIDENT_TABLES:-64}
      SERVER_PORT: ${SERVER_PORT:-8080}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-9464}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC}
      SPRING_SHELL_INTERACTIVE_ENABLED: ${SPRING_SHELL_INTERACTIVE_ENABLED:-true}
    volumes:
      # ONE volume for metadata (/data/meta) and blobs + upload spool (/data/storage/.tmp): a snapshot of it is atomic
      # across all of them (docs/guide/operations.md, "Резервное копирование")
      - sectoriadb-store:/data
    restart: unless-stopped
    # finish running requests on `docker stop` (server.shutdown=graceful, 30 s)
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 4 -O /dev/null http://127.0.0.1:$${MANAGEMENT_SERVER_PORT:-9464}/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # TLS termination (deploy/nginx/sectoriadb.conf; certificate: deploy/certs/fullchain.pem + privkey.pem,
  # for a local test create it with deploy/gen-self-signed.sh)
  nginx:
    image: nginx:1.27.5-alpine
    container_name: sectoriadb-nginx
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    networks:
      default:
        ipv4_address: 172.31.250.10
    volumes:
      - ./deploy/nginx/sectoriadb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      sectoriadb:
        condition: service_healthy
        # nginx resolves the upstream address at start: re-create it when sectoriadb is re-created
        restart: true
    restart: unless-stopped

volumes:
  sectoriadb-store:
    driver: local

networks:
  default:
    ipam:
      config:
        # fixed subnet so the proxy has a known address that the server trusts for X-Forwarded-Proto
        - subnet: 172.31.250.0/24

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stand: sectoria-bench

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Server metrics (management port, no SigV4). 5s while benchmarking: short runs need resolution.
  - job_name: sectoriadb
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sectoriadb:9464"]
        labels:
          instance: sectoria-1

  # Host (disk IO, CPU, network)
  - job_name: node
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: bench-host

  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
